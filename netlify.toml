[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Pinned on purpose. claude.mjs imports ../../src/lib/credits.js so the usage
# meter's cost model is shared with the client instead of duplicated — the number
# a user sees and the number they're charged can't drift apart. esbuild follows
# relative imports outside the functions directory; the legacy zisi bundler
# handles them less predictably, and a bundling failure here takes down every AI
# call in the app. Don't remove this without re-testing the proxy.
[functions]
  node_bundler = "esbuild"

# LOCAL DEV — pinned on purpose, and it needs to stay pinned.
#
# `npm run dev` is vite ALONE. Vite reads neither the [[redirects]] below nor
# netlify/functions, so /api/claude 404s and every AI call in the app dies with
# its generic catch message ("No reply came back. Try sending again." in
# Practice). Anything that touches the model has to run under `netlify dev`.
#
# Without this block Netlify has to guess how to serve the app, and framework
# detection can fall back to serving the STALE `dist` publish directory
# statically — which is what produced a bare 404 at the root. Naming the command
# and the ports removes the guess.
#
#   npx netlify dev   ->   http://localhost:8888   (not 5173)
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# Route the app's /api/claude call to the function.
[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200

# Route account deletion to its function. Required to be reachable in-app by
# App Store Guideline 5.1.1(v).
[[redirects]]
  from = "/api/delete-account"
  to = "/.netlify/functions/delete-account"
  status = 200

# Route read-aloud speech to the TTS function.
[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

# Route checkout session creation to its function.
[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

# Route the in-place plan change to its function. Separate from checkout on purpose:
# create-checkout-session is for somebody with no subscription, and pointing an existing
# subscriber at it creates a SECOND subscription and bills them twice.
[[redirects]]
  from = "/api/upgrade-subscription"
  to = "/.netlify/functions/upgrade-subscription"
  status = 200

# NOTE: there is deliberately NO "/* -> /index.html 200" SPA fallback here.
#
# The app has no client-side router (verified: nothing in src/ reads
# location.pathname, and there is no react-router dependency), so the fallback
# served no purpose while causing real damage: every non-existent URL returned
# the homepage with HTTP 200. That made /robots.txt and /sitemap.xml resolve to
# marketing HTML, and turned every typo'd link into a soft-404 that crawlers
# read as an unbounded set of duplicate pages.
#
# Without the catch-all, Netlify's default behavior applies: real files in the
# publish directory are served normally, and anything unmatched gets
# public/404.html with a correct HTTP 404 status.
#
# If a client-side router is ever added, restore a fallback — but scope it so it
# cannot shadow robots.txt, sitemap.xml, or 404.html.

# Long-cache immutable build assets (Vite fingerprints these filenames).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Let crawlers re-check these without fighting a stale CDN copy.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
